<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1b1c21">
<title>broker</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #1b1c21; --fg: #e9e9ee; --muted: #9a9ca8; --faint: #7d808c;
    --panel: #24262d; --line: #30323b; --button: #33353e; --button-fg: #e9e9ee;
    --primary: #4f7ef7; --primary-fg: #fff;
    --claim-bg: #2a261e; --claim-line: #c9a24a; --claim-fg: #d9b45c;
    --touch-bg: #1d2a22; --touch-line: #2f4c37; --ok: #5fd38a;
    --warn-bg: #2d2020; --warn-line: #a84a4a; --warn-fg: #ef8b8b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbfc; --fg: #1d1e22; --muted: #5f6270; --faint: #80838f;
      --panel: #f0f1f4; --line: #dcdee4; --button: #e6e7eb; --button-fg: #1d1e22;
      --claim-bg: #fbf4e2; --claim-line: #c9a24a; --claim-fg: #8a6716;
      --touch-bg: #eaf7ee; --touch-line: #b9e2c6; --ok: #1f9d55;
      --warn-bg: #fdeeee; --warn-line: #e3a1a1; --warn-fg: #b23b3b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Roboto", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  .mono { font-family: ui-monospace, "JetBrains Mono", "Roboto Mono", monospace; font-size: 14px; }
  header { display: flex; gap: 12px; align-items: center; }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--panel);
    display: flex; align-items: center; justify-content: center; flex: none; }
  .icon img { width: 24px; height: 24px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 20px 0 8px; }
  .secret { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; overflow-wrap: anywhere; }
  .secret .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .tag { font-size: 12px; color: var(--claim-fg); background: var(--claim-bg); border-radius: 5px; padding: 1px 6px; margin-left: 6px; }
  .changed { margin-top: 10px; background: var(--panel); border-left: 3px solid var(--primary);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; overflow-wrap: anywhere; }
  .grid { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; }
  .grid .k { color: var(--faint); }
  .grid .v { overflow-wrap: anywhere; }
  select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  .claim { margin-top: 16px; background: var(--claim-bg); border-left: 3px solid var(--claim-line);
    border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
  .claim .who { font-size: 12px; color: var(--claim-fg); margin-bottom: 2px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .action { margin-top: 20px; border-radius: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--line); }
  .action.touch { background: var(--touch-bg); border-color: var(--touch-line); display: flex; gap: 12px; align-items: center; }
  .action.error { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-fg); }
  .action .title { font-weight: 600; }
  .action .hint { color: var(--muted); font-size: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); flex: none; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
    70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--primary);
    border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px 18px; background: var(--button);
    color: var(--button-fg); cursor: pointer; width: 100%; }
  button.primary { background: var(--primary); color: var(--primary-fg); }
  button:disabled { opacity: .5; cursor: default; }
  .buttons { display: grid; gap: 10px; margin-top: 20px; }
  .result { display: flex; gap: 10px; align-items: center; font-size: 17px; font-weight: 600; }
  .result .mark { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; background: var(--ok); flex: none; }
  .result.bad .mark { background: var(--warn-line); }
  ol { padding-left: 22px; } li { margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
