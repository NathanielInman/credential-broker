name: CI

on:
  push:
    # Docs, pictures and notes never change a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Pictures/**"
      - "artwork/**"
      - "LICENSE"
      - "AGENTS.md"
  pull_request:
    branches: [master]
    # Docs, pictures and notes never change a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Pictures/**"
      - "artwork/**"
      - "LICENSE"
      - "AGENTS.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go vet . && go build .
        working-directory: broker-dialog

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go vet . && go build -ldflags "-H=windowsgui" .
        working-directory: broker-dialog

  dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: broker-dialog/go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet . && go build .
        working-directory: broker-dialog

  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgtk4-layer-shell-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: broker-board/go.mod
      - run: go vet . && go build -buildvcs=false .
        working-directory: broker-board
