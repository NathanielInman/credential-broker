name: Release

# Pushing a v* tag builds broker and broker-dialog for every platform,
# broker-board (the Signal Box panel) for linux, and the Android app, and
# publishes them as a GitHub release whose notes are the tag's message.
# broker-dialog links GTK on linux and Cocoa on macOS, so each platform
# builds on its own runner. Running it by hand builds everything without
# publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # broker-board links GTK 4, WebKitGTK 6 and gtk4-layer-shell. Ubuntu
  # 22.04 and 24.04 package no gtk4-layer-shell, so it builds in Debian 13
  # and joins the linux archive below; broker and broker-dialog keep the
  # older glibc floor.
  board:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgtk4-layer-shell-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: broker-board/go.mod
      - run: go build -buildvcs=false -trimpath -ldflags "-s -w" -o /tmp/board/broker-board .
        working-directory: broker-board
      - uses: actions/upload-artifact@v4
        with:
          name: board-${{ matrix.arch }}
          path: /tmp/board/broker-board

  linux:
    needs: [board]
    strategy:
      matrix:
        include:
          # The oldest supported image, so broker-dialog runs against an
          # older glibc and more distros can load it.
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/download-artifact@v4
        with:
          name: board-${{ matrix.arch }}
          path: board
      - name: Build
        run: |
          v=${GITHUB_REF_NAME#v}
          d=broker_${v}_linux_${{ matrix.arch }}
          mkdir $d
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$v" -o $d/broker .
          (cd broker-dialog && go build -trimpath -ldflags "-s -w" -o ../$d/broker-dialog .)
          install -m755 board/broker-board $d/broker-board
          cp LICENSE README.md $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Universal binaries, signed ad hoc with the hardened runtime, which
      # is what keeps other processes out of broker's memory.
      - name: Build
        run: |
          v=${GITHUB_REF_NAME#v}
          d=broker_${v}_darwin_universal
          mkdir $d
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o broker-$arch .
            (cd broker-dialog && CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o ../broker-dialog-$arch .)
          done
          lipo -create -output $d/broker broker-arm64 broker-amd64
          lipo -create -output $d/broker-dialog broker-dialog-arm64 broker-dialog-amd64
          codesign --force --sign - --options runtime $d/broker $d/broker-dialog
          cp LICENSE README.md $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          v=${GITHUB_REF_NAME#v}
          d=broker_${v}_windows_amd64
          mkdir $d
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o $d/broker.exe .
          (cd broker-dialog && go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../$d/broker-dialog.exe .)
          cp LICENSE README.md $d/
          7z a -bd $d.zip $d > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  # The phone app. Every release is signed with the same key (repository
  # secrets: the keystore base64 encoded, and its password), since Android
  # only upgrades an app signed like the one installed.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.BROKER_ANDROID_KEYSTORE }}
          BROKER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BROKER_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$BROKER_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::BROKER_ANDROID_KEYSTORE and BROKER_ANDROID_KEYSTORE_PASSWORD secrets are not set"
            exit 1
          fi
          export BROKER_ANDROID_KEYSTORE=$RUNNER_TEMP/broker.jks
          echo "$KEYSTORE" | base64 -d > "$BROKER_ANDROID_KEYSTORE"
          v=${GITHUB_REF_NAME#v}
          # A run by hand builds from a branch, which has no version.
          case $v in [0-9]*.[0-9]*.[0-9]*) version=$v ;; *) version=0.0.0 ;; esac
          ./gradlew --no-daemon -PbrokerVersion=$version assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../broker_${v}_android.apk
          rm "$BROKER_ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: "*.apk"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # checkout leaves the tag lightweight; the notes need its message.
      - run: git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      # Everything but the board-* artifacts, which are already in the
      # linux archives.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "[!b]*"
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" *
